name: android-build

on:
  workflow_dispatch:
  push:
    branches: [ android-port ]
    paths:
      - 'src/BD.WTTS.Client.Android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 11 (per global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Download tun2socks binaries
        run: |
          mkdir -p src/BD.WTTS.Client.Android/jniLibs/arm64-v8a src/BD.WTTS.Client.Android/jniLibs/x86_64
          curl -sL -o /tmp/t2s-arm64.zip https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-arm64.zip
          curl -sL -o /tmp/t2s-x64.zip  https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-amd64.zip
          cd /tmp && unzip -o t2s-arm64.zip && unzip -o t2s-x64.zip
          find /tmp -name 'tun2socks' -type f
          cp /tmp/tun2socks-linux-arm64/tun2socks src/BD.WTTS.Client.Android/jniLibs/arm64-v8a/libtun2socks.so || true
          cp /tmp/tun2socks-linux-amd64/tun2socks src/BD.WTTS.Client.Android/jniLibs/x86_64/libtun2socks.so || true
          # fallback: zip 解压在 /tmp 根
          [ -f src/BD.WTTS.Client.Android/jniLibs/arm64-v8a/libtun2socks.so ] || find /tmp -maxdepth 3 -name tun2socks -type f | head -2 | while read f; do file "$f" | grep -q aarch64 && cp "$f" src/BD.WTTS.Client.Android/jniLibs/arm64-v8a/libtun2socks.so || cp "$f" src/BD.WTTS.Client.Android/jniLibs/x86_64/libtun2socks.so; done
          ls -la src/BD.WTTS.Client.Android/jniLibs/*/

      - name: Restore
        run: dotnet restore src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj

      - name: Publish APK
        run: >
          dotnet publish src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/BD.WTTS.Client.Android -name '*-Signed.apk' -o -name '*.apk' | head -1)
          echo "path=$apk" >> $GITHUB_OUTPUT
          ls -la "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: watt-android-apk
          path: ${{ steps.apk.outputs.path }}
