name: android-build

on:
  workflow_dispatch:
  push:
    branches: [ android-port ]
    paths:
      - 'src/BD.WTTS.Client.Android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 11 (per global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
            10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Download tun2socks binaries
        run: |
          mkdir -p src/BD.WTTS.Client.Android/jniLibs/arm64-v8a src/BD.WTTS.Client.Android/jniLibs/x86_64
          curl -sL -o /tmp/t2s-arm64.zip https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-arm64.zip
          curl -sL -o /tmp/t2s-x64.zip  https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-linux-amd64.zip
          mkdir -p /tmp/t2s-arm64 /tmp/t2s-x64
          unzip -o /tmp/t2s-arm64.zip -d /tmp/t2s-arm64
          unzip -o /tmp/t2s-x64.zip -d /tmp/t2s-x64
          install -m 755 /tmp/t2s-arm64/tun2socks-linux-arm64 src/BD.WTTS.Client.Android/jniLibs/arm64-v8a/libtun2socks.so
          install -m 755 /tmp/t2s-x64/tun2socks-linux-amd64 src/BD.WTTS.Client.Android/jniLibs/x86_64/libtun2socks.so
          ls -la src/BD.WTTS.Client.Android/jniLibs/*/

      - name: Restore
        run: dotnet restore src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj

      - name: Setup release keystore
        run: |
          echo -n "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/watt-release.keystore
          # 校验 keystore 可用
          keytool -list -keystore /tmp/watt-release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}"

      - name: Publish APK (unsigned)
        run: >
          dotnet publish src/BD.WTTS.Client.Android/BD.WTTS.Client.Android.csproj
          -f net11.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Sign with apksigner (v1+v2+v3)
        run: |
          set -e
          unsigned=$(find src/BD.WTTS.Client.Android -name '*-Signed.apk' | head -1)
          echo "unsigned APK: $unsigned"
          # dotnet android workload 自带 build-tools（含 apksigner/zipalign）
          APKSIGNER=$(find /usr/share/dotnet ~/.dotnet /usr/lib/android-sdk ~ -name apksigner -type f 2>/dev/null | sort | tail -1)
          ZIPALIGN=$(find /usr/share/dotnet ~/.dotnet /usr/lib/android-sdk ~ -name zipalign -type f 2>/dev/null | sort | tail -1)
          echo "apksigner=$APKSIGNER"
          echo "zipalign=$ZIPALIGN"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN"
          chmod +x "$APKSIGNER" "$ZIPALIGN"
          "$ZIPALIGN" -f -p 4 "$unsigned" /tmp/aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/watt-release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/signed.apk /tmp/aligned.apk
          "$APKSIGNER" verify --print-certs /tmp/signed.apk
          cp /tmp/signed.apk "$unsigned"

      - name: Locate APK
        id: apk
        run: |
          apk=$(find src/BD.WTTS.Client.Android -name '*-Signed.apk' -o -name '*.apk' | head -1)
          echo "path=$apk" >> $GITHUB_OUTPUT
          ls -la "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: watt-android-apk
          path: ${{ steps.apk.outputs.path }}
